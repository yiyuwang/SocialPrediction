[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprediction"
version = "0.1.0"
description = "Reusable analysis helpers for the AgentPrediction notebook workflow."
requires-python = ">=3.9"
dependencies = [
    "bottleneck>=1.3.6",
    "ipykernel",
    "jupyter",
    "kneed",
    "matplotlib",
    "nibabel",
    "nilearn",
    "numpy",
    "pandas",
    "pingouin",
    "scikit-learn",
    "scikit-learn-extra",
    "scipy",
    "seaborn",
    "statsmodels",
    "SUITPy",
]

[tool.setuptools.packages.find]
where = ["src"]
